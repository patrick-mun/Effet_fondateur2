document:
  id: CAL-ACCEPTANCE
  version: 0.1.0
  date: 2026-10-28
  status: DRAFT
  language: fr
  development_step: D04
  authority:
    - calibration/PLAN_DEVELOPPEMENT_PANEL_SIMULATION.md
    - calibration/protocoles/REGISTRE_DECISIONS.md
    - docs/modules
  blockers_before_approval:
    - D03_PROTOCOL_NOT_REVIEWED
    - D05_SCHEMA_NOT_AVAILABLE
  statement: >-
    Ce document définit les mesures, leur sens d'amélioration et le traitement
    des valeurs manquantes. Les seuils marqués pilot_then_seal seront estimés
    uniquement sur le panel de calibration, puis figés avant toute ouverture
    du panel de validation aveugle.

decision_statuses:
  PASS: Tous les critères obligatoires évaluables respectent leur règle.
  FAIL: Au moins un critère obligatoire évalué enfreint sa règle.
  NOT_EVALUABLE: Une entrée, une vérité, une taille ou une mesure obligatoire manque.
  REVIEW_REQUIRED: Une décision humaine ou un seuil non encore scellé est requis.

rules:
  validation_panel_tuning_forbidden: true
  dock6_result_tuning_forbidden: true
  missing_is_never_success: true
  inherited_validation_forbidden: true
  confidence_level_default: 0.95
  interval_method_for_proportions: wilson_or_exact_binomial
  pilot_threshold_policy:
    source: pilot_calibration_only
    provisional_report_status: REVIEW_REQUIRED
    seal_before: pilot_validation
    absent_after_sealing: NOT_EVALUABLE
    modification_after_unblinding: FAIL
  aggregation_policy:
    mandatory_fail: FAIL
    mandatory_missing: NOT_EVALUABLE
    human_review_required: REVIEW_REQUIRED
    precedence:
      - FAIL
      - NOT_EVALUABLE
      - REVIEW_REQUIRED
      - PASS

