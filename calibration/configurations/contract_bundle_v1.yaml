resolved_gaps:
  GAP-R04-01: nine schemas and eight governance roots are indexed in this bundle
  GAP-R04-02: truth_router grants only stage-specific truth after run closure
  GAP-R04-03: stage 09 requires a signed and hashed human decision artifact
  GAP-R04-04: stage 16C declares the 16A summary or control receipt as mandatory
  GAP-R04-05: stage 17 uses a signed closed-run registry for all sixteen domains
  GAP-R04-06: every dynamic output is exhaustively named and hashed by its producer
  GAP-R04-07: stage 18 is limited to SVG and provenance before R14
  GAP-R04-08: stage 19 assembles Markdown and traceability; HTML/PDF remain R14-only
  GAP-R06-01: release_guard enforces resolved paths, process isolation policy and private-root refusal
  GAP-R06-02: partition-specific HMAC pseudonyms and six disjoint reference pools are required
  GAP-R06-03: canonical single-factor diffs and a signed registry cover stages 16B and 16C
legacy_calibration_modules:
  authorization: excluded
  reuse_condition: explicit adequacy proof against this bundle and a new targeted test
