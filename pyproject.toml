[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "effet-fondateur"
version = "0.1.0"
description = "Pipeline reproductible d'étude d'un possible effet fondateur"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21,<5",
    "numpy==1.26.4",
    "PyYAML>=6.0,<7",
    "scipy>=1.11,<1.14",
    "fpdf2>=2.7",
]

[project.scripts]
effet-fondateur = "effet_fondateur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
effet_fondateur = [
    "reporting/assets/*",
    "reporting/assets/vendor/*",
    "resources/references/*.json",
    "resources/schemas/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]
extend-exclude = ["archive", "data"]

[tool.ruff.lint]
# Commencer par les erreurs Python et le code manifestement inutilisé.
select = ["F"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = [
    "src/effet_fondateur/external_tools.py",
    "src/effet_fondateur/orchestrator/environment.py",
    "src/effet_fondateur/phasing/shapeit5.py",
    "src/effet_fondateur/phasing/execution.py",
    "src/effet_fondateur/references/window.py",
    "src/effet_fondateur/references/harmonization.py",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.coverage.run]
branch = true
source = ["effet_fondateur"]
# Plusieurs tests d'intégration exécutent une étape dans un interpréteur enfant.
patch = ["subprocess"]
# Le test de distribution installe une seconde copie temporaire du paquet.
omit = ["*/installed/effet_fondateur/*"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
skip_empty = true
omit = ["*/installed/effet_fondateur/*"]
