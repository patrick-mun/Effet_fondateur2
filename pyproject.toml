[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "effet-fondateur"
version = "0.1.0"
description = "Pipeline reproductible d'étude d'un possible effet fondateur"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21,<5",
    "PyYAML>=6.0,<7",
]

[project.scripts]
effet-fondateur = "effet_fondateur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
